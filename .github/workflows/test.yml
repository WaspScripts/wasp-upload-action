name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run all
      - name: Check dist is up to date
        run: git diff --exit-code -- dist || (echo "::error::dist is outdated, run pnpm run all and commit it" && exit 1)

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile test scripts
        uses: ./
        with:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PATH: test
          SCRIPTS: all
          DRY_RUN: true

  # Every push to main that passes the tests is released as YYYY.MM.DD-HASH, like WaspLib.
  release:
    needs: [build, compile]
    if: ${{ github.repository_owner == 'WaspScripts' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        run: echo "VERSION=$(date -u +'%Y.%m.%d')-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
