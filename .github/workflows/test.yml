name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run all
      - name: Check dist is up to date
        run: git diff --exit-code -- dist || (echo "::error::dist is outdated, run pnpm run all and commit it" && exit 1)

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile test scripts
        uses: ./
        with:
          SB_URL: ${{ secrets.SB_URL }}
          SB_ANON_KEY: ${{ secrets.SB_ANON_KEY }}
          PATH: test
          SCRIPTS: all
          DRY_RUN: true
